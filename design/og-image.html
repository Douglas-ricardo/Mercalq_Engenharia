<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,800&family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#312d2a;color:#f5f1ee;font-family:Archivo,sans-serif;position:relative;
 background-image:radial-gradient(circle,#4e4946 1px,transparent 1.25px);background-size:24px 24px}
.copy{position:absolute;left:72px;top:64px;width:520px;display:flex;flex-direction:column;height:502px}

.brand img{height:60px}
.name{font-stretch:125%;font-weight:800;font-size:26px;letter-spacing:.04em;line-height:28px}
.sub{font-family:Michroma;font-size:12px;letter-spacing:.3em;color:#e8913f;margin-top:4px}

<div class="copy">
 <div class="brand"><img src="mercalq-simbolo.png"><div><div class="name">MERCALQ</div><div class="sub">ENGENHARIA</div></div></div>

</div>

<div class="bar"></div>
