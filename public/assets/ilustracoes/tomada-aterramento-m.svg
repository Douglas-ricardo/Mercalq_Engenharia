<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Elevação de parede com tomada testada: pino terra sem continuidade e ponto instalado abaixo da altura do projeto">
  <defs>
    <pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#e2dfda"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="#f4f3f1"/>
  <rect width="1200" height="800" fill="url(#d)"/>
  <g fill="none" stroke="#2f2b28" stroke-linecap="square">
    <!-- piso -->
    <path d="M140 660H1060" stroke-width="8"/>
    <!-- tomada instalada (NBR 14136): placa, rebaixo e três furos -->
    <rect x="400" y="400" width="180" height="180" stroke-width="4"/>
    <circle cx="490" cy="490" r="60" stroke-width="2"/>
    <circle cx="462" cy="474" r="10" stroke-width="2.5"/>
    <circle cx="518" cy="474" r="10" stroke-width="2.5"/>
    <circle cx="490" cy="514" r="10" stroke-width="2.5"/>
    <!-- testador de tomadas: corpo, pinos e três LEDs (o do terra apagado) -->
    <rect x="700" y="400" width="200" height="180" stroke-width="3"/>
    <path d="M700 460h-24M700 490h-24M700 520h-24" stroke-width="3"/>
    <circle cx="750" cy="452" r="14" fill="#0f6e7a" stroke="none"/>
    <circle cx="800" cy="452" r="14" fill="#0f6e7a" stroke="none"/>
    <circle cx="850" cy="452" r="14" stroke="#b42318" stroke-width="3"/>
    <path d="M606 490H664" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- posição prevista no projeto elétrico -->
    <rect x="400" y="140" width="180" height="180" stroke="#77736f" stroke-width="2" stroke-dasharray="10 8"/>
    <!-- destaque do furo terra -->
    <circle cx="490" cy="514" r="26" stroke="#a4500c" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <!-- cotas de altura -->
  <g stroke="#77736f" stroke-width="1" fill="none">
    <path d="M330 660V490M322 490h16M322 660h16"/>
    <path d="M250 660V230M242 230h16M242 660h16"/>
  </g>
  <g fill="#4f4b47" font-family="IBM Plex Mono, monospace" font-size="46">
    <text x="318" y="600" text-anchor="end">0,30</text>
    <text x="150" y="214">1,10</text>
    <text x="700" y="632" fill="#77736f" font-size="44">TESTADOR</text>
    <text x="600" y="200" fill="#77736f" font-size="44">PROJETO</text>
  </g>
  <!-- marcadores numerados -->
  <g font-family="IBM Plex Mono, monospace" font-size="40" font-weight="500" text-anchor="middle">
    <circle cx="548" cy="560" r="36" fill="#fc7824"/><text x="548" y="574" fill="#221e1b">1</text>
    <circle cx="580" cy="320" r="36" fill="#fc7824"/><text x="580" y="334" fill="#221e1b">2</text>
  </g>
  <rect x="140" y="722" width="120" height="5" fill="#d6751b"/>
  <text x="280" y="738" fill="#4f4b47" font-family="IBM Plex Mono, monospace" font-size="42">TERRA SEM CONTINUIDADE</text>
</svg>
